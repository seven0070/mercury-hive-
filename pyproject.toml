[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mercury-hive"
version = "0.1.0"
description = "A governed virtual AI company operated by one human system owner"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0.36,<3.0",
    "aiosqlite>=0.20,<1.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "argon2-cffi>=23.1,<24.0",
    "pyjwt>=2.10,<3.0",
    "pyyaml>=6.0,<7.0",
    "structlog>=24.4,<25.0",
    "msgpack>=1.2.1,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.8,<1.0",
    "pip-audit>=2.7,<3.0",
    "cyclonedx-bom>=7.0,<8.0",
    "psycopg2-binary>=2.9,<3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "S",   # flake8-bandit
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "N",   # pep8-naming
]
ignore = [
    "S101",  # assert used (needed in tests)
    "S105",  # hardcoded password (false positives in tests)
    "S106",  # hardcoded password (false positives in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S101", "S105", "S106", "S603", "S607"]

[tool.hatch.build.targets.wheel]
packages = ["apps", "services", "domain", "policies", "database", "scripts"]
